server:
  port: 8080

spring:
  application:
    name: logipilot-api

  datasource:
    # Microsoft SQL Server. encrypt=false e trustServerCertificate=true valem
    # para o servidor local de desenvolvimento, que usa certificado autoassinado.
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORTA:1433};databaseName=${DB_NOME:logipilot};encrypt=false;trustServerCertificate=true
    username: ${DB_USUARIO:logipilot}
    password: ${DB_SENHA:LogiPilot!2026}

  jpa:
    # O esquema é criado pelo Flyway (db/migration); o Hibernate só confere se
    # as entidades batem com as tabelas e reclama na subida se divergirem.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: always

  servlet:
    multipart:
      # Fotos de comprovante tiradas pelo celular.
      max-file-size: 8MB
      max-request-size: 10MB

logipilot:
  comprovantes:
    # As fotos ficam no disco; no banco guarda-se apenas o nome do arquivo.
    diretorio: ${COMPROVANTES_DIR:comprovantes}

  cors:
    # Portas que o Vite usa quando a 5173 já está ocupada.
    origens: http://localhost:5173,http://localhost:5174,http://localhost:5175

logging:
  level:
    org.flywaydb: info
